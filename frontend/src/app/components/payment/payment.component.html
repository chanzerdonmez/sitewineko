<div class="container my-5">
  <h1 class="mb-4 text-center">Paiement</h1>

  <!-- Barre de progression -->
  <div class="progress mb-4 w-100">
    <div 
      class="progress-bar" 
      role="progressbar" 
      [style.width]="step === 1 ? '50%' : '100%'" 
      [style.backgroundColor]="'#6130f2'"
      [attr.aria-valuenow]="step === 1 ? '50' : '100'" 
      aria-valuemin="0" 
      aria-valuemax="100">
    </div>
  </div>

  <!-- Étape 1 : Adresse de Livraison -->
  <div *ngIf="step === 1">
    <h2 class="mb-4">Adresse de Livraison</h2>
    <form [formGroup]="deliveryForm">
      <div class="form-row">
        <div class="col-md-6 mb-3">
          <label for="firstName">Prénom</label>
          <input type="text" id="firstName" formControlName="firstName" class="form-control" placeholder="Prénom">
        </div>

        <div class="col-md-6 mb-3">
          <label for="name">Nom</label>
          <input type="text" id="name" formControlName="name" class="form-control" placeholder="Nom">
        </div>
      </div>

      <div class="form-row">
        <div class="col-md-6 mb-3">
          <label for="streetName">Nom de la rue</label>
          <input type="text" id="streetName" formControlName="streetName" class="form-control" placeholder="Nom de la rue">
        </div>

        <div class="col-md-6 mb-3">
          <label for="streetNumber">Numéro de rue</label>
          <input type="text" id="streetNumber" formControlName="streetNumber" class="form-control" placeholder="Numéro de rue">
        </div>
      </div>

      <div class="form-row">
        <div class="col-md-6 mb-3">
          <label for="city">Ville</label>
          <input type="text" id="city" formControlName="city" class="form-control" placeholder="Ville">
        </div>

        <div class="col-md-6 mb-3">
          <label for="zipCode">Code postal</label>
          <input type="text" id="zipCode" formControlName="zipCode" class="form-control" placeholder="Code postal">
        </div>
      </div>
    </form>
    <div class="d-flex justify-content-end">
      <button class="btn btn-primary" (click)="nextStep()">Suivant</button>
    </div>
  </div>

  <!-- Étape 2 : Adresse de Facturation -->
  <div *ngIf="step === 2">
    <h2 class="mb-4">Adresse de Facturation</h2>
    <form [formGroup]="billingForm">
      <div class="form-row">
        <div class="col-md-6 mb-3">
          <label for="firstName">Prénom</label>
          <input type="text" id="firstName" formControlName="firstName" class="form-control" placeholder="Prénom">
        </div>

        <div class="col-md-6 mb-3">
          <label for="name">Nom</label>
          <input type="text" id="name" formControlName="name" class="form-control" placeholder="Nom">
        </div>
      </div>

      <div class="form-row">
        <div class="col-md-6 mb-3">
          <label for="streetName">Nom de la rue</label>
          <input type="text" id="streetName" formControlName="streetName" class="form-control" placeholder="Nom de la rue">
        </div>

        <div class="col-md-6 mb-3">
          <label for="streetNumber">Numéro de rue</label>
          <input type="text" id="streetNumber" formControlName="streetNumber" class="form-control" placeholder="Numéro de rue">
        </div>
      </div>

      <div class="form-row">
        <div class="col-md-6 mb-3">
          <label for="city">Ville</label>
          <input type="text" id="city" formControlName="city" class="form-control" placeholder="Ville">
        </div>

        <div class="col-md-6 mb-3">
          <label for="zipCode">Code postal</label>
          <input type="text" id="zipCode" formControlName="zipCode" class="form-control" placeholder="Code postal">
        </div>
      </div>
    </form>
    <div class="d-flex justify-content-between">
      <button class="btn btn-secondary" id="btn-back" (click)="previousStep()">Retour</button>
      <button class="btn btn-success" id="btn-payment" (click)="nextStep()">Payer avec Stripe</button>
    </div>
  </div>

  <!-- Chargement et Erreur -->
  <div *ngIf="loading" class="text-center mt-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-3">Redirection vers la page de paiement...</p>
  </div>

  <div *ngIf="error" class="alert alert-danger mt-5" role="alert">
    Une erreur est survenue lors de la redirection vers Stripe : {{ error }}
  </div>
</div>

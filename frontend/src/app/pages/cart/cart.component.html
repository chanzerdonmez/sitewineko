<!-- cart.component.html -->
<app-header></app-header>

<h4 class="text-center mb-5 mt-5">Mon panier</h4>

<div class="container mt-5">
    <table class="table">
        <thead>
            <tr>
                <th scope="col">Produit</th>
                <th scope="col">Description</th>
                <th scope="col">Prix</th>
                <th scope="col">Quantité</th>
                <th scope="col">Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let article of articles">
                <td><img src="https://picsum.photos/75" alt="{{ article.title }}"></td>
                <td>{{ article.title }}</td>
                <td>{{ article.price | currency: 'EUR':'symbol':'1.2-2':'fr' }}</td>
                <td>{{ cartItems.get(article.id) }}</td>
                <td>
                    <button type="button" class="btn btn-danger" (click)="removeFromCart(article.id)">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
    <div class="text-end">
        <h5>Total du panier : {{ totalPrice | currency: 'EUR':'symbol':'1.2-2':'fr' }}</h5>
        <button class="btn btn-secondary" (click)="clearCart()">Vider le Panier</button>
        <button class="btn btn-primary" id="btn-paiement">Procéder au paiement</button>
    </div>
</div>

<app-footer></app-footer>

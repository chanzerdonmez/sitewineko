<h5 class="mb-3 mt-5">Liste des commandes existantes</h5>
<table class="table">
  <thead>
    <tr>
      <th scope="col">Numéro de commande</th>
      <th scope="col">Date de la commande</th>
      <th scope="col">Email</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let order of orders">
      <td>{{ order.numberOrder }}</td>
      <td>{{ order.dateCreation | date:'shortDate' }}</td>
      <td>{{ order.user?.email }}</td>
      <td>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckChecked" checked>
          <label class="form-check-label" for="flexSwitchCheckChecked"></label>
        </div>
      </td>
      <td>
        <button type="button" class="btn btn-primary" (click)="updateOrder(order.id)">Modifier</button>
        <button type="button" class="btn btn-secondary mx-2">Voir</button>
        <button type="button" class="btn btn-danger">Supprimer</button>
      </td>
    </tr>
  </tbody>
</table>

<div class="d-flex flex-column justify-content-center align-items-center vh-100">
    <h1 class="text-center mb-4">Réinitialisation du mot de passe</h1>
    <div class="container">
      <form [formGroup]="resetPasswordForm" (ngSubmit)="submitForm()" novalidate>
        <div class="row justify-content-center">
          <div class="col-md-4">
            <div class="mb-3">
              <input type="password" id="newPassword" formControlName="newPassword" class="form-control form-input" placeholder="Nouveau mot de passe" />
              <div *ngIf="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched" class="text-danger">
                Le mot de passe est requis et doit contenir au moins 6 caractères.
              </div>
            </div>
            <div class="mb-3">
              <input type="password" id="confirmNewPassword" formControlName="confirmNewPassword" class="form-control form-input" placeholder="Confirmer le nouveau mot de passe" />
              <div *ngIf="resetPasswordForm.errors?.['mismatch'] && resetPasswordForm.get('confirmNewPassword')?.touched" class="text-danger">
                Les mots de passe ne correspondent pas.
              </div>
            </div>
            <button type="submit" id="btn-reset-2" class="btn btn-primary w-100" [disabled]="resetPasswordForm.invalid">Réinitialiser le mot de passe</button>
          </div>
        </div>
      </form>
    </div>
  </div>

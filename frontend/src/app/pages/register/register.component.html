<div class="container-fluid vh-100 d-flex justify-content-center align-items-center">
    <div class="row w-100 g-0">
      <div class="col-12 d-flex justify-content-center align-items-center">
        <form class="w-100" style="max-width: 500px;">
            <div class="text-center mb-4">
                <a href="/">
                    <img src="assets/images/wineko6.svg" alt="Winéko Logo" style="width: 300px; height: auto; margin-bottom: 30px;">
                </a>
            </div>
          <h4 class="text-center mb-4">Inscription</h4>
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Adresse e-mail</label>
            <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Mot de passe</label>
            <input type="password" class="form-control" id="exampleInputPassword1">

          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1">
            <label class="form-check-label" for="exampleCheck1">J'accepte les termes et conditions.</label>
          </div>
          <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
          <div class="mt-3 text-center">
            <p>Vous avez déjà un compte ? <a href="/login">Connectez-vous ici</a></p>
        </div>
        </form>
      </div>
    </div>
  </div>
